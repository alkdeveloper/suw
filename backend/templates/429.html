<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çok Fazla İstek</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .icon {
      width: 72px;
      height: 72px;
      background: #f59e0b1a;
      border: 2px solid #f59e0b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      background: #f59e0b1a;
      border: 1px solid #f59e0b66;
      color: #fcd34d;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      margin: 20px 0 28px;
    }

    .code {
      font-size: 48px;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 4px;
      letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">429</div>
    <div class="icon">⚡</div>
    <h1>Çok Fazla İstek Gönderildi</h1>
    <p>Bu IP adresinden çok kısa sürede çok fazla istek geldi.</p>
    <p>Güvenlik nedeniyle erişiminiz geçici olarak askıya alındı.</p>
    <div class="badge">30 dakika sonra tekrar deneyin</div>
  </div>
</body>
</html>
