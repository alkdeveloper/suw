<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erişim Engellendi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .icon {
      width: 72px;
      height: 72px;
      background: #ef44441a;
      border: 2px solid #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      background: #ef44441a;
      border: 1px solid #ef444466;
      color: #fca5a5;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      margin: 20px 0 28px;
    }

    .back-link {
      display: inline-block;
      margin-top: 8px;
      color: #64748b;
      font-size: 13px;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .back-link:hover {
      color: #94a3b8;
      border-bottom-color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Hesap Geçici Olarak Kilitlendi</h1>
    <p>Çok fazla başarısız giriş denemesi yapıldı.</p>
    <p>Güvenliğiniz için bu IP adresi geçici olarak engellendi.</p>
    <div class="badge">30 dakika sonra tekrar deneyin</div>
    <br>
    <a href="/admin/login/" class="back-link">← Giriş sayfasına dön</a>
  </div>
</body>
</html>
