services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suw_backend
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"

    # Docker ağı içerisinde PostgreSQL'e "db" servis adıyla bağlanır.
    # Container içindeki PostgreSQL portu 5432'dir.
    environment:
      DB_HOST: db
      DB_PORT: "5432"

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: suw_db
    restart: always

    env_file:
      - ./backend/.env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5434:5432"

  frontend:
    container_name: suw_frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}

    ports:
      - "3001:3000"

    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://backend:8000/api/
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data: