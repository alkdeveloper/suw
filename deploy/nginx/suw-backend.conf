upstream suw_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.suw.com.tr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cms.suw.com.tr;

    ssl_certificate /etc/letsencrypt/live/cms.suw.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.suw.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;

    location / {
        proxy_pass http://suw_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
